<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIRE Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 800px; }
    label, input { display: block; margin-bottom: 10px; }
    input[type="number"], input[type="date"] { width: 100%; padding: 5px; }
    canvas { margin-top: 30px; }
  </style>
</head>
<body>
  <h1>FIRE Simulator - Scenario A</h1>

  <label>Birthday:
    <input type="date" id="birthday" value="1987-11-23" />
  </label>
  <label>Starting Investments ($):
    <input type="number" id="startInvest" value="500000" />
  </label>
  <label>Annual Growth Rate (%):
    <input type="number" id="growthRate" value="4.0" step="0.1" />
  </label>
  <label>Age to Start Contributing:
    <input type="number" id="startAge" value="37" />
  </label>
  <label>Age to Stop Contributing:
    <input type="number" id="stopAge" value="40" />
  </label>
  <label>Monthly Contribution ($):
    <input type="number" id="monthlyContrib" value="8333" />
  </label>
  <label>Monthly Expenses ($):
    <input type="number" id="monthlyExp" value="6250" />
  </label>
  <label>Age to Start Withdrawing:
    <input type="number" id="withdrawAge" value="55" />
  </label>
  <label>Social Security Monthly ($):
    <input type="number" id="ssMonthly" value="0" />
  </label>
  <label>Social Security Age:
    <input type="number" id="ssAge" value="67" />
  </label>
  <label>Pension Lump Sum ($):
    <input type="number" id="pension" value="0" />
  </label>

  <button onclick="runSimulation()">Run Simulation</button>

  <canvas id="fireChart" width="800" height="400"></canvas>

  <script>
    function runSimulation() {
      console.log("Simulation running...");
      const birthday = new Date(document.getElementById('birthday').value);
      const startInvest = +document.getElementById('startInvest').value;
      const growthRate = +document.getElementById('growthRate').value / 100;
      const startAge = +document.getElementById('startAge').value;
      const stopAge = +document.getElementById('stopAge').value;
      const monthlyContrib = +document.getElementById('monthlyContrib').value;
      const monthlyExp = +document.getElementById('monthlyExp').value;
      const withdrawAge = +document.getElementById('withdrawAge').value;
      const ssMonthly = +document.getElementById('ssMonthly').value;
      const ssAge = +document.getElementById('ssAge').value;
      const pension = +document.getElementById('pension').value;

      const startMonth = Math.floor(startAge * 12);
      const stopMonth = Math.floor(stopAge * 12);
      const withdrawMonth = Math.floor(withdrawAge * 12);
      const ssMonth = Math.floor(ssAge * 12);

      const balances = [startInvest];
      const ages = [startAge];
      const labels = [birthday.toISOString().split('T')[0]];

      const monthlyRate = Math.pow(1 + growthRate, 1 / 12) - 1;

      for (let m = startMonth + 1; m <= 95 * 12; m++) {
        let age = m / 12;
        let balance = balances[balances.length - 1] * (1 + monthlyRate);

        if (m === stopMonth) balance += pension;
        if (m >= startMonth && m < stopMonth) balance += monthlyContrib;
        if (m >= withdrawMonth) balance -= monthlyExp;
        if (m >= ssMonth) balance += ssMonthly;
        if (balance < 0) balance = 0;

        balances.push(balance);
        ages.push(age);
        const date = new Date(birthday);
        date.setMonth(date.getMonth() + m);
        labels.push(date.toISOString().split('T')[0]);
      }

      if (window.fireChart && typeof window.fireChart.destroy === 'function') {
        window.fireChart.destroy();
      }
      const ctx = document.getElementById('fireChart').getContext('2d');
      window.fireChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ages,
          datasets: [{
            label: 'Portfolio Balance ($)',
            data: balances,
            borderColor: 'blue',
            borderWidth: 2,
            fill: false,
            pointRadius: 0
          }]
        },
        options: {
          scales: {
            x: {
              title: { display: true, text: 'Age' },
              min: 30,
              max: 95
            },
            y: {
              title: { display: true, text: 'Balance ($)' },
              beginAtZero: true
            }
          }
        }
      });
    }
  </script>
</body>
</html>
